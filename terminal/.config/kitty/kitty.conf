# Configuration
font_family                 JetBrainsMono Nerd Font Mono
font_size                   10
bold_font                   auto
italic_font                 auto
bold_italic_font            auto
remember_window_size        no
initial_window_width        950
initial_window_height       500
cursor_blink_interval       0.5
cursor_stop_blinking_after  1
scrollback_lines            2000
wheel_scroll_min_lines      1
enable_audio_bell           no
window_padding_width        10
hide_window_decorations     yes
background_opacity          0.95
dynamic_background_opacity  yes
confirm_os_window_close     0
# selection_foreground        none
# selection_background        none
cursor_trail 0

enabled_layouts splits:split_axis=horizontal,stack

# Open a new terminal session below the current pane.
map kitty_mod+enter combine : launch --location=hsplit --cwd=current : layout_action move_to_screen_edge bottom : layout_action bias 30

# Open agents on the left
map kitty_mod+f6 combine : launch --location=vsplit --cwd=current --title=Codex codex : layout_action move_to_screen_edge left : layout_action bias 30
map kitty_mod+f7 combine : launch --location=vsplit --cwd=current --title=Claude claude : layout_action move_to_screen_edge left : layout_action bias 30

# Temporarily show only the focused pane. Focus the editor first to hide the agent.
map kitty_mod+z toggle_layout stack

# Vim-style pane navigation: Ctrl+Shift+h/j/k/l.
map kitty_mod+h neighboring_window left
map kitty_mod+j neighboring_window down
map kitty_mod+k neighboring_window up
map kitty_mod+l neighboring_window right

# Close the currently focused split and terminate its process.
map kitty_mod+w close_window


# BEGIN_KITTY_THEME
# Catppuccin-Frappe
include current-theme.conf
# END_KITTY_THEME

# Fix symbols - extended Material Design Icons range
