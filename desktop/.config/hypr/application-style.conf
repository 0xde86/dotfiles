# hyprland-qt-support, the org.hyprland.style QML style that hyprpolkitagent
# (the polkit auth dialog) forces on itself. Shape and motion only; its colors
# come from the Qt palette, which env.lua points at the GTK theme.
# Ref https://wiki.hypr.land/Hypr-Ecosystem/hyprland-qt-support/

roundness     = 1     # 0..3 -> 0/4/8/16px; 4px matches decoration:rounding
border_width  = 2     # px, matches general:border_size
reduce_motion = false
