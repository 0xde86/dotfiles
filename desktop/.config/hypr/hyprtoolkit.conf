# Catppuccin Frappe. Shared by every hyprtoolkit app (hyprlauncher, ...).
# Ref https://wiki.hypr.land/Hypr-Ecosystem/hyprtoolkit/

# Surfaces, darkest to lightest. hyprtoolkit expects this ordering: background
# is the window backdrop, base the raised surface, alternate_base above that.
background     = 0xFF292C3C # mantle
base           = 0xFF303446 # base
alternate_base = 0xFF414559 # surface0

text        = 0xFFC6D0F5 # text
bright_text = 0xFFF2D5CF # rosewater

# Mirrors the active border gradient in visuals.lua (teal -> rosewater).
accent           = 0xFFF2D5CF # rosewater
accent_secondary = 0xFF81C8BE # teal

# Kept comment-free: hyprlang hands the rest of the line to string values.
font_family           = JetBrainsMonoNL Nerd Font
font_family_monospace = JetBrainsMono Nerd Font Mono
icon_theme            = Adwaita

rounding_small = 4 # decoration:rounding in visuals.lua
rounding_large = 6 # waybar's outer radius
